apiVersion: v1
kind: Pod
metadata:
  name: load-generator
  namespace: default
spec:
  containers:
  - name: load-generator
    image: busybox:1.28
    command:
    - /bin/sh
    - -c
    - |
      echo "Starting load generator..."
      while true; do
        wget -q -O- http://nginx-test-service/
        sleep 0.1
      done
  restartPolicy: Never
